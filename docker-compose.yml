version: "3.9"

services:
  api:
    build: ./api
    container_name: weather_api
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    networks:
      - appnet
    env_file:
      - ./api/.env

  frontend:
    build: ./frontend
    container_name: weather_frontend
    ports:
      - "5173:5173"
    networks:
      - appnet

  collector:
    build: ./collector
    container_name: weather_collector
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - appnet
    env_file:
      - ./collector/.env

  worker:
    build: ./worker
    container_name: weather_worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - appnet
    env_file:
      - ./worker/.env

  mongo:
    image: mongo:6
    container_name: weather_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - appnet

  rabbitmq:
    image: rabbitmq:3-management
    container_name: weather_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - appnet

volumes:
  mongo_data:

networks:
  appnet:
